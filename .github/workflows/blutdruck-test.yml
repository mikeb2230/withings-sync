name: TEST Withings to Garmin v6

on:
  workflow_dispatch:

jobs:
  test-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install withings-sync 6.0.2
        run: |
          python -m pip install --upgrade pip
          pip install withings-sync==6.0.2

      - name: Restore Withings authentication
        env:
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
        run: |
          echo "$WITHINGS_USER_JSON" | base64 --decode > "$HOME/.withings_user.json"
          chmod 600 "$HOME/.withings_user.json"

          python -m json.tool "$HOME/.withings_user.json" >/dev/null
          echo "Withings authentication restored successfully."

      - name: Run v6 test
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
        run: |
          set -o pipefail
          withings-sync --features BLOOD_PRESSURE --verbose 2>&1 | tee sync-test.log
